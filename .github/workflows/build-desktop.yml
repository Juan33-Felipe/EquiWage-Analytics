name: Build Desktop Applications (Windows & macOS)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            output_ext: '*.exe'
          - os: macos-latest
            platform: mac
            output_ext: '*.dmg'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo (Shared, Backend bundle, Frontend)
        run: pnpm run build

      - name: Package Desktop App for Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish never

      - name: Package Desktop App for macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish never

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EquiWage-Analytics-${{ matrix.platform }}
          path: |
            release/${{ matrix.output_ext }}
            release/*.zip
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/${{ matrix.output_ext }}
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
